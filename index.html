<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="app">
    <span class="eyebrow">Arcade &middot; Reflex</span>
    <h1>Comet Run</h1>
    <p class="tagline">Dodge the meteor storm. Survive the drop.</p>

    <div id="stats">
      <div class="stat score">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="divider"></div>
      <div class="stat best">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="best">0</span>
      </div>
    </div>

    <div id="frame">
      <span class="bracket tl"></span>
      <span class="bracket tr"></span>
      <span class="bracket bl"></span>
      <span class="bracket br"></span>
      <canvas id="game" width="440" height="550"></canvas>
      <div id="overlay">
        <div id="overlayCard">
          <span id="overlayStatus">&gt; Standby</span>
          <h2 id="overlayTitle">Comet Run</h2>
          <p id="overlayMsg">Steer clear of the falling meteors for as long as you can.</p>
          <button id="startBtn">Launch</button>
        </div>
      </div>
    </div>

    <p class="controls-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd> to steer &middot; swipe on touch</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
